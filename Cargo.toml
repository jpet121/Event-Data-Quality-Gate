[package]
name = "sesv"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

[dependencies]
libc = "=0.2.191"
regress = { version = "=0.12.0", features = ["utf16"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value", "arbitrary_precision"] }
sha2 = "0.10"
num-bigint = "0.4"
